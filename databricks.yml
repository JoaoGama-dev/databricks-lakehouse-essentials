# Bundle do pacote Essentials: lakehouse medalhão (bronze, silver, gold) orientado por
# metadados. As fontes do cliente ficam em config/fontes.yml.
# O mesmo código roda no Free Edition (dev) e no Azure Databricks do cliente (prod);
# só muda o target.
bundle:
  name: essentials_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo do Unity Catalog onde ficam as tabelas
    default: workspace
  schema:
    description: Schema das tabelas bronze, silver e gold
    default: essentials
  landing_path:
    description: Raiz da landing zone; cada fonte tem sua pasta (config/fontes.yml)
    default: /Volumes/workspace/essentials/landing
  alert_email:
    description: E-mail que recebe o aviso quando a carga diária falha
    default: seu-email@exemplo.com

targets:
  # Free Edition: só serverless, landing zone em um Volume do Unity Catalog.
  dev:
    mode: development
    default: true
    workspace:
      # Troque pela URL do seu workspace Free Edition.
      host: https://dbc-XXXXXXXX-XXXX.cloud.databricks.com

  # Azure Databricks do cliente: landing zone no ADLS Gen2, execução pelo service principal.
  prod:
    mode: production
    workspace:
      # Troque pela URL do workspace Azure Databricks do cliente.
      host: https://adb-0000000000000000.0.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd
      landing_path: abfss://landing@STORAGEACCOUNT.dfs.core.windows.net
    run_as:
      # Application ID do service principal de produção.
      service_principal_name: 00000000-0000-0000-0000-000000000000
