# Bundle de um projeto do pacote Essentials: lakehouse medalhão (bronze, silver, gold)
# orientado por metadados. As fontes do projeto ficam em config/fontes.yml.
# O mesmo código roda no Free Edition (dev) e no Azure Databricks do cliente (prod);
# só muda o target.
#
# Convenção do pacote Essentials (detalhes em docs/padroes/nomes.md):
#   catálogo  essentials (dev) ou o catálogo do cliente (prod)
#   schema    <projeto>_bronze         bronze e o volume landing (só engenharia)
#   schema    <projeto>_silver         silver e a função de máscara (só engenharia)
#   schema    <projeto>_gold           gold (leitura para o negócio)
#   schema    <projeto>_monitoramento  event log, log da carga e views mon_* (só engenharia)
#   bundle    essentials_<projeto>, para cada projeto ter sua pasta no workspace
#   job       <projeto>_job_carga_diaria; pipeline <projeto>_pipeline_medalhao
# Os schemas e o volume são criados pelo bundle (resources/governanca.yml). Em dev, o
# modo development os prefixa com dev_<usuário>_, isolando cada desenvolvedor.
# Para um projeto novo, troque o nome do bundle e a variável "projeto".
bundle:
  name: essentials_portfolio

include:
  - resources/*.yml

variables:
  projeto:
    description: Nome do projeto em snake_case; vira os schemas e entra no nome do job e do pipeline
    default: portfolio
  catalog:
    description: Catálogo do Unity Catalog do pacote (dev) ou do cliente (prod)
    default: essentials
  grupo_engenharia:
    description: Quem administra os schemas e a landing do projeto (no cliente, um grupo)
    default: ${workspace.current_user.userName}
  grupo_leitura_gold:
    description: Quem lê a gold e o painel (no cliente, o grupo dos usuários de negócio)
    default: account users
  grupo_dados_pessoais:
    description: Quem vê dados pessoais sem máscara (no cliente, um grupo restrito)
    default: ${workspace.current_user.userName}
  warehouse_id:
    description: SQL warehouse que executa as consultas do painel AI/BI (localizado pelo nome)
    lookup:
      warehouse: Serverless Starter Warehouse
  alert_email:
    # Não versione o e-mail real: passe-o no deploy com --var="alert_email=..." ou com a
    # variável de ambiente BUNDLE_VAR_alert_email.
    description: E-mail que recebe os avisos de falha, demora e atraso da carga diária
    default: alertas@exemplo.com
  usuario_alerta:
    # O alerta SQL só notifica usuários do workspace (ou um destino de notificação criado
    # pelo administrador; veja docs/roteiro-de-operacao.md), não um e-mail qualquer.
    description: Usuário do workspace que recebe o alerta SQL de atraso da carga
    default: ${workspace.current_user.userName}
  cliente:
    description: Cliente do projeto, em snake_case; vira a tag cliente para separar o custo
    default: demonstracao
  ingerir_fontes_externas:
    # Precisa refletir o fontes.yml: um teste falha se divergir (docs/adr/0004).
    description: '"true" quando o fontes.yml tem fonte do tipo banco ou api; senão a tarefa de ingestão é pulada'
    default: "false"
  fuso_horario:
    description: Fuso (nome IANA) dos horários do log legível das tarefas do job
    default: America/Sao_Paulo
  limite_duracao_carga_segundos:
    description: Duração da carga diária que dispara o aviso de demora (normal em dev, 2 a 6 min)
    default: 900
  limite_atraso_horas:
    description: Horas sem atualização do pipeline que disparam o alerta de atraso
    default: 26
  limite_queda_volume_pct:
    description: Queda percentual do retrato, de uma carga para a outra, que dispara o alerta de volume
    default: 50
  teto_custo_mensal_usd:
    # Valor do diagnóstico para o Databricks (preço de lista); a nuvem toda tem o Budget do
    # Azure, configurado no portal.
    description: Teto mensal de custo do Databricks, em dólares de preço de lista; alerta a partir de 80%
    default: 150
  email_suporte:
    description: E-mail do suporte da Logos, que também recebe o aviso de falha do job (abre o chamado)
    default: suporte@exemplo.com
  destino_suporte_id:
    # Destino de notificação de e-mail criado pelo administrador do workspace com o e-mail do
    # suporte: os alertas SQL só notificam usuários do workspace ou destinos.
    description: ID do destino de notificação do suporte da Logos para os alertas SQL (só em prod)
    default: ""
  landing_url:
    description: Endereço da landing externa de produção (abfss://, s3:// ou gs://), sobre uma external location
    default: ""

# Tags em todos os recursos (job, pipeline), para separar o custo por projeto e cliente
# nas tabelas de sistema de faturamento.
presets:
  tags:
    projeto: ${var.projeto}
    cliente: ${var.cliente}
    ambiente: ${bundle.target}

targets:
  # Free Edition: só serverless, landing zone num volume gerenciado do Unity Catalog.
  # O host não fica no repositório: vem do perfil da CLI (databricks auth login) na sua
  # máquina e da variável DATABRICKS_HOST no CI.
  dev:
    mode: development
    default: true
    resources:
      # Os dados do projeto nunca são apagados por um destroy (também em prod).
      schemas:
        bronze: &protegido
          lifecycle:
            prevent_destroy: true
        silver: *protegido
        gold: *protegido
        monitoramento: *protegido
      volumes:
        landing: *protegido
      jobs:
        # O modo development não pausa um agendamento com pause_status explícito: em dev a
        # carga roda só quando alguém manda (o workflow de integração roda toda noite).
        essentials_carga_diaria:
          schedule:
            pause_status: PAUSED
      alerts:
        # Em dev os alertas ficam pausados (dá para rodá-los à mão na tela de cada alerta),
        # menos o falha_carga: ele fica ativo e avisa o usuario_alerta (quem implantou), para
        # o e-mail de falha com o motivo ser conferido no dev.
        atraso_carga: &pausado
          schedule:
            pause_status: PAUSED
        qualidade_carga: *pausado
        custo_teto: *pausado

  # Testes de integração (.github/workflows/integracao.yml, docs/adr/0005): o mesmo
  # workspace do dev, com estado de deploy próprio e o projeto com sufixo _ci, o que gera
  # dev_<usuário>_<projeto>_ci_bronze, _ci_silver, _ci_gold e _ci_monitoramento, sem tocar
  # no dev.
  # O workflow apaga tudo ao fim, por isso aqui os schemas e o volume ficam sem
  # prevent_destroy (a proteção é declarada só no dev e no prod).
  ci:
    mode: development
    variables:
      # Sempre o projeto do bundle + "_ci" (um teste confere).
      projeto: portfolio_ci
    resources:
      jobs:
        essentials_carga_diaria:
          schedule:
            pause_status: PAUSED
      alerts:
        atraso_carga: &pausado_ci
          schedule:
            pause_status: PAUSED
        falha_carga: *pausado_ci
        qualidade_carga: *pausado_ci
        custo_teto: *pausado_ci

  # Azure Databricks do cliente: landing num volume externo sobre o ADLS Gen2, execução
  # pelo service principal e grupos do cliente.
  prod:
    mode: production
    workspace:
      # Troque pela URL do workspace Azure Databricks do cliente.
      host: https://adb-0000000000000000.0.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd
      # Troque pelo nome do cliente e pelo usuário responsável pela carga no workspace dele.
      cliente: cliente
      usuario_alerta: responsavel@cliente.com.br
      # Teto do Databricks combinado no diagnóstico, o e-mail e o destino de notificação do
      # suporte da Logos (criado pelo administrador no workspace do cliente).
      teto_custo_mensal_usd: 150
      email_suporte: suporte@exemplo.com
      destino_suporte_id: 00000000-0000-0000-0000-000000000000
      # Landing externa: abfss:// no Azure (padrão), s3:// na AWS, gs:// no GCP.
      landing_url: abfss://landing@STORAGEACCOUNT.dfs.core.windows.net/${var.projeto}
      grupo_engenharia: essentials_engenharia
      grupo_leitura_gold: essentials_leitura_gold
      grupo_dados_pessoais: essentials_dados_pessoais
    resources:
      schemas:
        bronze: &protegido_prod
          lifecycle:
            prevent_destroy: true
        silver: *protegido_prod
        gold: *protegido_prod
        monitoramento: *protegido_prod
      volumes:
        landing:
          volume_type: EXTERNAL
          # Precisa de uma external location do Unity Catalog sobre este caminho.
          storage_location: ${var.landing_url}
          lifecycle:
            prevent_destroy: true
      alerts:
        # Em prod, os alertas também vão para o suporte da Logos (abre o chamado). O target
        # acrescenta à lista de resources/alertas.yml, que já tem o usuario_alerta.
        atraso_carga: &avisar_suporte
          evaluation:
            notification:
              subscriptions:
                - destination_id: ${var.destino_suporte_id}
        falha_carga: *avisar_suporte
        qualidade_carga: *avisar_suporte
        custo_teto: *avisar_suporte
    run_as:
      # Application ID do service principal de produção.
      service_principal_name: 00000000-0000-0000-0000-000000000000
