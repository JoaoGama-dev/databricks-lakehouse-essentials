[pytest]
testpaths = tests
# Por padrão só os testes de unidade, que rodam sem Databricks (CI de PR, pre-commit e
# "pytest -q"). Os de integração rodam no workflow integracao.yml com
# "pytest -m integracao tests/integracao/<arquivo>" (o último -m vale).
addopts = -m "not integracao"
markers =
    unidade: testes que rodam sem Databricks (marcados automaticamente pelo tests/conftest.py)
    integracao: testes que leem os dados do target ci no Databricks (tudo em tests/integracao/)
