[pytest]
testpaths = tests
# Por padrão só os testes de unidade, que rodam sem Databricks (CI de PR, pre-commit e
# "pytest -q"). Os de integração rodam no workflow integracao.yml com
# "pytest -m integracao tests/projeto/integracao/<arquivo>" (o último -m vale).
# tests/nucleo/ testa o motor e o repositório; tests/projeto/, o exemplo do cliente
# (docs/padroes/nucleo-e-projeto.md).
addopts = -m "not integracao"
markers =
    unidade: testes que rodam sem Databricks (marcados automaticamente pelo tests/conftest.py)
    integracao: testes que leem os dados do target ci no Databricks (tudo em tests/projeto/integracao/)
