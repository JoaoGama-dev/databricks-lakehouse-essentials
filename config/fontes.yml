# Fontes de dados do projeto.
# Este é o ÚNICO arquivo que muda de um cliente para outro: cada item de "fontes"
# gera automaticamente as tabelas bronze e silver (src/pipeline/bronze.py e silver.py).
# O formato é validado por config/fontes.schema.json.
#
# NOMES DAS TABELAS (padrão camada_tipo_nome)
#   bronze_<nome>                     dado bruto, exatamente como chegou
#   silver_int_<nome>_preparada       view temporária de silver_<nome>.sql (se houver)
#   silver_int_<nome>_retrato         snapshot: último retrato limpo, onde ficam as regras
#   silver_int_<nome>_mudancas        cdc: mudanças limpas, onde ficam as regras
#   silver_int_<nome>_unico_<cols>    checagem das regras "unico"
#   silver_<nome>                     estado atual (no incremental, também onde ficam as regras)
#   silver_<nome>_historico           histórico SCD tipo 2 (se historico: true)
#   gold_dim_* / gold_fato_* / gold_agg_*   escritas à mão em src/pipeline/gold_*.sql
#
# CAMPOS DE CADA FONTE
#   nome               snake_case; entra no nome das tabelas
#   descricao          texto livre; entra no COMMENT das tabelas
#   tipo               de onde vem o dado:
#                        arquivo -> arquivos na landing zone (csv, json, parquet ou texto)
#                        tabela  -> tabela que já existe no Unity Catalog
#                        banco   -> banco externo via conexão do Unity Catalog; o job
#                                   src/ingestao/banco_para_landing.py grava parquet na landing
#                        api     -> API REST; o job src/ingestao/api_para_landing.py grava
#                                   JSON na landing
#   modo_carga         como a fonte entrega os dados:
#                        incremental -> cada registro chega uma vez; a silver só acrescenta
#                        snapshot    -> a fonte reenvia tudo a cada vez; a silver guarda o
#                                       retrato mais recente (AUTO CDC FROM SNAPSHOT)
#                        cdc         -> a fonte envia inclusões, alterações e exclusões;
#                                       a silver aplica as mudanças (AUTO CDC)
#   historico          true cria também silver_<nome>_historico (SCD tipo 2, com
#                      __START_AT e __END_AT). Só para snapshot e cdc.
#   chave_primaria     colunas que identificam um registro, com os nomes padronizados.
#                      Em snapshot e cdc, cada uma precisa de uma regra nao_nulo com drop.
#   coluna_atualizacao coluna que diz qual versão de um registro é a mais recente
#                      (data de atualização, número de linha etc.)
#   preparacao_sql     true quando a fonte precisa de lógica própria antes da limpeza
#                      padrão. Nesse caso existe src/pipeline/silver_<nome>.sql com a view
#                      temporária silver_int_<nome>_preparada, lida no lugar da bronze.
#
# BLOCO DO TIPO (só o do tipo escolhido)
#   arquivo:  formato (csv | json | parquet | texto), caminho (pasta dentro da landing),
#             opcoes (opções de leitura do Auto Loader, como header e sep)
#   tabela:   nome_completo (catalogo.schema.tabela; {catalogo} e {projeto} viram o
#             catálogo e o projeto do target)
#   banco:    conexao (conexão do Unity Catalog; o catálogo estrangeiro tem o mesmo nome),
#             tabela_origem (schema.tabela no banco), coluna_watermark (coluna crescente
#             usada para trazer só o que é novo), pasta_landing
#   api:      url, autenticacao (tipo: bearer | api_key | nenhuma; escopo e chave do
#             secret scope), pasta_landing, campo_registros (onde fica a lista na resposta),
#             paginacao (parametro da página e limite de páginas)
#   cdc:      (só modo cdc) coluna_operacao e valor_exclusao
#
# COLUNAS (limpeza padrão e nome padronizado na silver)
#   A chave de cada item é o NOME FINAL da coluna, com prefixo da classe da informação;
#   "origem" é o nome da coluna na bronze (ou na view preparada).
#     id_ identificador   cd_ código       nm_ nome          ds_ descrição
#     sg_ sigla           st_ status       nr_ número        qt_ quantidade
#     vl_ valor           pc_ percentual   dt_ data          dh_ data e hora
#     hr_ hora (hh:mm)    fl_ flag
#   O prefixo precisa combinar com o tipo (ex.: dt_ só com data); a validação recusa o contrário.
#   Toda coluna de texto recebe TRIM e perde espaços repetidos; texto vazio vira nulo.
#   A silver tem contrato explícito: só entram as colunas listadas aqui (mais as técnicas
#   _fonte, _arquivo_origem e _ingerido_em). O que não for listado fica só na bronze.
#     origem               nome da coluna de entrada
#     descricao            o que a coluna significa para o negócio; vira o COMMENT da coluna
#                          no Unity Catalog (dicionário de dados). Obrigatória.
#     tipo                 texto | inteiro | decimal | data | timestamp | booleano
#     formatos             formatos aceitos para data/timestamp, tentados em ordem
#     caixa                titulo | maiuscula | minuscula
#     remover_ponto_final  true tira pontos no fim do texto ("Maria Exemplo." vira "Maria Exemplo")
#     mapa_valores         de-para de valores escritos de vários jeitos (compara em minúsculas)
#     valor_se_vazio       valor usado quando o campo vem vazio
#     mascarar             telefone (deixa só os 4 últimos dígitos) | hash (sha256), por LGPD
#
# REGRAS (viram expectations, com os nomes padronizados das colunas)
#   nome      nome da regra, aparece na aba Data quality
#   tipo      nao_nulo (coluna) | valores_aceitos (coluna, valores) |
#             expressao (expressao SQL) | unico (colunas)
#   acao      drop   -> descarta a linha
#             alerta -> a linha segue e a violação é contada
#   A regra "unico" só aceita alerta: ela é checada à parte, em
#   silver_int_<nome>_unico_<colunas>. Para garantir unicidade, use chave_primaria com
#   modo snapshot ou cdc.

fontes:
  # Planilha de agenda de entrevistas do RH. Cada arquivo é a planilha inteira do ano
  # (snapshot). A data aparece só nas linhas "AGENDA DIA dd/mm/aaaa", por isso o arquivo
  # é lido inteiro como texto e quebrado em linhas em src/pipeline/silver_agenda.sql.
  - nome: agenda
    descricao: Agenda de entrevistas de emprego, exportada da planilha do RH.
    tipo: arquivo
    arquivo:
      formato: texto
      caminho: agenda
      opcoes:
        wholeText: "true"
    modo_carga: snapshot
    historico: true
    preparacao_sql: true
    chave_primaria: [dt_entrevista, nm_candidato]
    coluna_atualizacao: _linha
    colunas:
      dt_entrevista:
        origem: data_entrevista
        descricao: Data da entrevista, tirada da linha AGENDA DIA da planilha.
        tipo: data
        formatos: ["dd/MM/yyyy", "yyyy-MM-dd"]
      hr_entrevista:
        origem: horario
        descricao: Horário da entrevista no formato HH:mm; vazio quando a planilha não informa.
        tipo: texto
      nm_candidato:
        origem: nome_candidato
        descricao: Nome do candidato, sem espaços sobrando e com as iniciais maiúsculas.
        tipo: texto
        caixa: titulo
        remover_ponto_final: true
      nm_vaga:
        origem: vaga
        descricao: Nome da vaga como escrito na planilha, com as iniciais maiúsculas.
        tipo: texto
        caixa: titulo
        remover_ponto_final: true
      nr_telefone:
        origem: telefone
        descricao: Telefone do candidato mascarado por LGPD (DDD e 4 últimos dígitos); vazio quando inválido.
        tipo: texto
        mascarar: telefone
      st_entrevista:
        origem: status
        descricao: Resultado da entrevista padronizado (Aprovado, Reprovado, Não atendeu, Cancelado, Reagendado, Pendente).
        tipo: texto
        remover_ponto_final: true
        valor_se_vazio: Pendente
        mapa_valores:
          aprovado: Aprovado
          aprovada: Aprovado
          reprovado: Reprovado
          reprovada: Reprovado
          "n/ atendeu": Não atendeu
          "n/atendeu": Não atendeu
          "não atendeu": Não atendeu
          cancelou: Cancelado
          cancelado: Cancelado
          cancelada: Cancelado
          reagendado: Reagendado
          reagendada: Reagendado
    regras:
      - nome: nome_preenchido
        tipo: nao_nulo
        coluna: nm_candidato
        acao: drop
      - nome: data_entrevista_valida
        tipo: nao_nulo
        coluna: dt_entrevista
        acao: drop
      - nome: status_conhecido
        tipo: valores_aceitos
        coluna: st_entrevista
        valores: [Aprovado, Reprovado, Não atendeu, Cancelado, Reagendado, Pendente]
        acao: alerta
      - nome: telefone_valido
        tipo: nao_nulo
        coluna: nr_telefone
        acao: alerta
      - nome: horario_valido
        tipo: expressao
        expressao: "hr_entrevista RLIKE '^[0-9]{1,2}:[0-9]{2}$'"
        acao: alerta

  # Cadastro de cargos: liga o começo do nome da vaga a uma área da empresa.
  # No Free Edition, a tabela é criada por setup/00_setup_free_edition.sql.
  - nome: cargos
    descricao: Cadastro de cargos do RH, que liga o nome da vaga a uma área.
    tipo: tabela
    tabela:
      nome_completo: "{catalogo}.{projeto}_origem.cadastro_cargos"
    modo_carga: snapshot
    historico: false
    chave_primaria: [id_cargo]
    coluna_atualizacao: dh_atualizacao
    colunas:
      id_cargo:
        origem: id_cargo
        descricao: Identificador do cargo no cadastro do RH.
        tipo: inteiro
      ds_prefixo_vaga:
        origem: prefixo_vaga
        descricao: Começo do nome da vaga, em minúsculas; o prefixo mais longo que combinar define o cargo.
        tipo: texto
        caixa: minuscula
      nm_area:
        origem: area
        descricao: Área da empresa à qual o cargo pertence.
        tipo: texto
      dh_atualizacao:
        origem: atualizado_em
        descricao: Data e hora da última alteração do cargo no cadastro de origem.
        tipo: timestamp
    regras:
      - nome: id_cargo_preenchido
        tipo: nao_nulo
        coluna: id_cargo
        acao: drop
      - nome: prefixo_preenchido
        tipo: nao_nulo
        coluna: ds_prefixo_vaga
        acao: drop
      - nome: area_conhecida
        tipo: valores_aceitos
        coluna: nm_area
        valores:
          - Cozinha
          - Atendimento
          - Recepção
          - Limpeza e conservação
          - Administrativo
          - Financeiro
          - Logística e produção
          - Vendas
          - Serviços especializados
        acao: alerta
      - nome: prefixo_unico
        tipo: unico
        colunas: [ds_prefixo_vaga]
        acao: alerta
