# Governança no Unity Catalog como código: schemas, volume e permissões do projeto.
# Modelo de acesso (docs/adr/0001-modelo-de-acesso-no-unity-catalog.md):
#   <projeto>       bronze e silver, com dado bruto e intermediário: só engenharia
#   <projeto>_gold  gold, pronta para o negócio: engenharia e leitura
#   landing         arquivos recebidos das fontes: só engenharia
# A proteção contra destroy (lifecycle.prevent_destroy) fica nos targets dev e prod do
# databricks.yml, não aqui: o target ci precisa poder ser destruído, e a CLI antes da
# v1.22 ignora um override para false (docs/adr/0005). Um teste exige a proteção.
resources:
  schemas:
    projeto:
      catalog_name: ${var.catalog}
      name: ${var.projeto}
      comment: Projeto do pacote Essentials, camadas bronze e silver. Acesso só da engenharia.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES

    gold:
      catalog_name: ${var.catalog}
      name: ${var.projeto}_gold
      comment: Projeto do pacote Essentials, camada gold (dimensões, fatos e agregadas) para o negócio.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES
        - principal: ${var.grupo_leitura_gold}
          privileges:
            - USE_SCHEMA
            - SELECT

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.projeto.name}
      name: landing
      volume_type: MANAGED
      comment: Landing zone do projeto, uma pasta por fonte (config/fontes.yml).
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - READ_VOLUME
            - WRITE_VOLUME
