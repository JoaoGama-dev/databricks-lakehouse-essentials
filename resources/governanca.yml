# Governança no Unity Catalog como código: schemas, volume e permissões do projeto.
# Um schema por camada, no mesmo catálogo (docs/adr/0001-modelo-de-acesso-no-unity-catalog.md):
#   <projeto>_bronze         dado bruto e o volume landing: só engenharia
#   <projeto>_silver         dado limpo e a função de máscara: só engenharia
#   <projeto>_gold           gold, pronta para o negócio: engenharia e leitura
#   <projeto>_monitoramento  event log, views mon_* e mon_falhas: só engenharia
# A proteção contra destroy (lifecycle.prevent_destroy) fica nos targets dev e prod do
# databricks.yml, não aqui: o target ci precisa poder ser destruído, e a CLI antes da
# v1.22 ignora um override para false (docs/adr/0005). Um teste exige a proteção.
resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: ${var.projeto}_bronze
      comment: Projeto do pacote Essentials, camada bronze (dado como chegou) e landing. Acesso só da engenharia.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES

    silver:
      catalog_name: ${var.catalog}
      name: ${var.projeto}_silver
      comment: Projeto do pacote Essentials, camada silver (dado limpo e histórico). Acesso só da engenharia.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES

    gold:
      catalog_name: ${var.catalog}
      name: ${var.projeto}_gold
      comment: Projeto do pacote Essentials, camada gold (fatos e views) para o negócio.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES
        - principal: ${var.grupo_leitura_gold}
          privileges:
            - USE_SCHEMA
            - SELECT

    monitoramento:
      catalog_name: ${var.catalog}
      name: ${var.projeto}_monitoramento
      comment: Projeto do pacote Essentials, monitoramento (event log, views mon_* e falhas). Acesso só da engenharia.
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - ALL_PRIVILEGES

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: landing
      volume_type: MANAGED
      comment: Landing zone do projeto, uma pasta por fonte (config/fontes.yml).
      grants:
        - principal: ${var.grupo_engenharia}
          privileges:
            - READ_VOLUME
            - WRITE_VOLUME
