# Painéis AI/BI do projeto.
# As consultas dos painéis não citam catálogo nem schema: dataset_catalog e dataset_schema
# apontam para o ambiente do target, então o mesmo painel serve em dev e em prod.
# Para trazer ajustes feitos na tela de volta ao repositório:
#   databricks bundle generate dashboard --resource painel_negocio --force -t dev
resources:
  dashboards:
    # Painel do negócio: o conteúdo é do projeto (src/dashboards/negocio.lvdash.json) e lê
    # só as views gold_vw_* da gold. A chave e o arquivo são os mesmos em todo projeto.
    painel_negocio:
      display_name: Essentials · ${var.projeto} · Negócio
      file_path: ../src/dashboards/negocio.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.gold.catalog_name}
      dataset_schema: ${resources.schemas.gold.name}
      # Quem abre o painel consulta com as próprias permissões do Unity Catalog:
      # sem acesso à gold, não vê os dados.
      embed_credentials: false

    # Saúde da plataforma: atraso, qualidade e custo, a partir das views mon_* do schema de
    # monitoramento. Painel separado porque esse schema é só da engenharia (docs/adr/0001).
    painel_saude:
      display_name: Essentials · ${var.projeto} · Saúde da plataforma
      file_path: ../src/dashboards/saude.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.monitoramento.catalog_name}
      dataset_schema: ${resources.schemas.monitoramento.name}
      embed_credentials: false
