# Carga diária às 6h (horário de Brasília). Ordem das tarefas:
#   tem_fonte_externa        condição (sem computação): o fontes.yml tem fonte banco ou api?
#   ingerir_fontes_externas  traz bancos e APIs para a landing; pulada (Excluded, sem custo)
#                            quando a variável ingerir_fontes_externas é "false" (docs/adr/0004)
#   preparar_governanca      função de máscara, tabela mon_log_execucao e view mon_falhas
#   processar_medalhao       o pipeline: bronze, silver e gold
#   publicar_monitoramento   views da gold, tags, views mon_*, log da carga e, se algo falhou,
#                            o motivo seguro; termina com erro quando a carga falhou
#   avisar_falha             só quando a carga falhou: avalia o alerta falha_carga na hora,
#                            e o e-mail sai com o motivo (docs/adr/0015)
#   encerrar_com_falha       só depois do aviso: deixa a execução marcada como falha
resources:
  jobs:
    essentials_carga_diaria:
      # A chave essentials_carga_diaria não muda (o bundle recriaria o job); o nome visível, sim.
      name: ${var.projeto}_job_carga_diaria
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      # Aviso quando a carga demora bem mais que o normal (em dev, de 2 a 6 minutos).
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: ${var.limite_duracao_carga_segundos}
      email_notifications:
        on_failure:
          - ${var.alert_email}
          - ${var.email_suporte}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}
      environments:
        - environment_key: ingestao
          spec:
            environment_version: "2"
            # Versões fixas, num único lugar: requirements-runtime.txt.
            dependencies:
              - -r ${workspace.file_path}/requirements-runtime.txt
      tasks:
        - task_key: tem_fonte_externa
          condition_task:
            op: EQUAL_TO
            left: ${var.ingerir_fontes_externas}
            right: "true"

        - task_key: ingerir_fontes_externas
          depends_on:
            - task_key: tem_fonte_externa
              outcome: "true"
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/ingestao/ingerir_fontes_externas.py
            parameters:
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --landing
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}
              - --codigo
              - ${workspace.file_path}/src
              - --fuso-horario
              - ${var.fuso_horario}

        # A gold usa a função de máscara: ela precisa existir antes do pipeline.
        - task_key: preparar_governanca
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/governanca/governanca.py
            parameters:
              - --codigo
              - ${workspace.file_path}/src
              - --catalogo
              - ${resources.schemas.silver.catalog_name}
              - --schema-silver
              - ${resources.schemas.silver.name}
              - --schema-monitoramento
              - ${resources.schemas.monitoramento.name}
              - --grupo-dados-pessoais
              - ${var.grupo_dados_pessoais}
              - --fuso-horario
              - ${var.fuso_horario}

        # NONE_FAILED: roda com a ingestão pulada, mas não se ela ou a preparação falharem.
        # full_refresh false: um full refresh apagaria o histórico SCD2 (docs/adr/0017).
        - task_key: processar_medalhao
          depends_on:
            - task_key: ingerir_fontes_externas
            - task_key: preparar_governanca
          run_if: NONE_FAILED
          pipeline_task:
            pipeline_id: ${resources.pipelines.essentials_pipeline.id}
            full_refresh: false

        # ALL_DONE: roda com qualquer resultado das anteriores, para registrar o que houve.
        # Só termina com erro se uma etapa dela falhar; a falha das outras tarefas vai para a
        # avisar_falha e a encerrar_com_falha (assim o serverless não a repete).
        - task_key: publicar_monitoramento
          depends_on:
            - task_key: ingerir_fontes_externas
            - task_key: preparar_governanca
            - task_key: processar_medalhao
          run_if: ALL_DONE
          max_retries: 0
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/governanca/publicar_monitoramento.py
            parameters:
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --codigo
              - ${workspace.file_path}/src
              - --catalogo
              - ${resources.schemas.silver.catalog_name}
              - --schema-bronze
              - ${resources.schemas.bronze.name}
              - --schema-silver
              - ${resources.schemas.silver.name}
              - --schema-gold
              - ${resources.schemas.gold.name}
              - --schema-monitoramento
              - ${resources.schemas.monitoramento.name}
              - --job-id
              - "{{job.id}}"
              - --run-id
              - "{{job.run_id}}"
              # O custo é atribuído ao projeto pela tag projeto (todos os ambientes); o warehouse
              # só entra quando é dedicado ao projeto.
              - --projeto
              - ${var.projeto}
              - --ambiente
              - ${bundle.target}
              - --warehouse-id
              - ${var.warehouse_id}
              - --warehouse-dedicado
              - ${var.warehouse_dedicado}
              - --limite-atraso-horas
              - ${var.limite_atraso_horas}
              - --limite-queda-volume-pct
              - ${var.limite_queda_volume_pct}
              - --teto-custo-mensal
              - ${var.teto_custo_mensal_usd}
              # Cotação das colunas em reais das views de custo; inválida faz a etapa falhar.
              - --cotacao-usd-brl
              - ${var.cotacao_usd_brl}
              - --fuso-horario
              - ${var.fuso_horario}

        # Só quando alguma tarefa falhou, depois de o motivo ser gravado pela
        # publicar_monitoramento: avalia o alerta falha_carga na hora, sem esperar o agendamento
        # das 7h (que continua como rede de segurança). Sem subscribers aqui, avisa quem já está
        # inscrito no alerta (usuario_alerta e, em prod, o destino do suporte).
        - task_key: avisar_falha
          depends_on:
            - task_key: ingerir_fontes_externas
            - task_key: preparar_governanca
            - task_key: processar_medalhao
            - task_key: publicar_monitoramento
          run_if: AT_LEAST_ONE_FAILED
          max_retries: 0
          alert_task:
            alert_id: ${resources.alerts.falha_carga.id}
            warehouse_id: ${var.warehouse_id}

        # Folha do job: o resultado da execução sai das tarefas folha. Sem esta, a avisar_falha
        # terminaria bem e a execução ficaria "Succeeded with failures", sem o aviso de falha
        # do job. Pulada (Excluded) quando a avisar_falha é pulada.
        - task_key: encerrar_com_falha
          depends_on:
            - task_key: avisar_falha
          run_if: ALL_DONE
          max_retries: 0
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/src/governanca/encerrar_com_falha.sql
              source: WORKSPACE
