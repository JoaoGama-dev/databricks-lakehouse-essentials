# Carga diária às 6h (horário de Brasília). Em dev, o agendamento fica pausado
# automaticamente pelo modo development.
# Ordem: os jobs de ingestão trazem bancos e APIs para a landing; depois o pipeline
# atualiza bronze, silver e gold. Sem fontes desses tipos, as duas tarefas só avisam
# que não há nada a fazer.
resources:
  jobs:
    essentials_carga_diaria:
      name: essentials_${var.projeto}_carga_diaria
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
      environments:
        - environment_key: ingestao
          spec:
            environment_version: "2"
            # Versões fixas, num único lugar: requirements-runtime.txt.
            dependencies:
              - -r ${workspace.file_path}/requirements-runtime.txt
      tasks:
        - task_key: ingestao_api
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/ingestao/api_para_landing.py
            parameters:
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --landing
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}
              - --codigo
              - ${workspace.file_path}/src

        - task_key: ingestao_banco
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/ingestao/banco_para_landing.py
            parameters:
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --landing
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}
              - --codigo
              - ${workspace.file_path}/src

        # Cria a função de máscara de dados pessoais, usada pelas colunas sensíveis da gold.
        - task_key: governanca_antes
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/governanca/governanca.py
            parameters:
              - --etapa
              - antes
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --codigo
              - ${workspace.file_path}/src
              - --catalogo
              - ${resources.schemas.projeto.catalog_name}
              - --schema
              - ${resources.schemas.projeto.name}
              - --schema-gold
              - ${resources.schemas.gold.name}
              - --grupo-dados-pessoais
              - ${var.grupo_dados_pessoais}

        - task_key: atualizar_lakehouse
          depends_on:
            - task_key: ingestao_api
            - task_key: ingestao_banco
            - task_key: governanca_antes
          pipeline_task:
            pipeline_id: ${resources.pipelines.essentials_pipeline.id}
            full_refresh: false

        # Aplica a tag pii nas colunas sensíveis da silver e da gold (config/fontes.yml).
        - task_key: governanca_depois
          depends_on:
            - task_key: atualizar_lakehouse
          environment_key: ingestao
          spark_python_task:
            python_file: ../src/governanca/governanca.py
            parameters:
              - --etapa
              - depois
              - --config
              - ${workspace.file_path}/config/fontes.yml
              - --codigo
              - ${workspace.file_path}/src
              - --catalogo
              - ${resources.schemas.projeto.catalog_name}
              - --schema
              - ${resources.schemas.projeto.name}
              - --schema-gold
              - ${resources.schemas.gold.name}
              - --grupo-dados-pessoais
              - ${var.grupo_dados_pessoais}
