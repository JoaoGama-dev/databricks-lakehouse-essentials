# Pipeline declarativo (Lakeflow Spark Declarative Pipelines), orientado por metadados:
# bronze.py e silver.py criam as tabelas de cada fonte a partir do config/fontes.yml.
# Os caminhos das libraries são relativos a este arquivo. Ao criar um
# src/pipeline/silver_<nome>.sql ou gold_*.sql, inclua-o na lista abaixo.
resources:
  pipelines:
    essentials_pipeline:
      name: essentials_${var.projeto}
      # Schema padrão: bronze e silver. A gold é publicada no schema gold (schema_gold).
      catalog: ${resources.schemas.projeto.catalog_name}
      schema: ${resources.schemas.projeto.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        catalogo: ${var.catalog}
        projeto: ${var.projeto}
        schema_gold: ${resources.schemas.gold.name}
        landing_path: /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}
        fontes_config: ${workspace.file_path}/config/fontes.yml
        diretorio_codigo: ${workspace.file_path}/src
      environment:
        # Versões fixas, num único lugar: requirements-runtime.txt.
        dependencies:
          - -r ${workspace.file_path}/requirements-runtime.txt
      libraries:
        - file:
            path: ../src/pipeline/bronze.py
        - file:
            path: ../src/pipeline/silver.py
        - file:
            path: ../src/pipeline/silver_agenda.sql
        - file:
            path: ../src/pipeline/gold_entrevistas.sql
