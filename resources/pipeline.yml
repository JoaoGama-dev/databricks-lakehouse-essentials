# Pipeline declarativo (Lakeflow Spark Declarative Pipelines), orientado por metadados:
# bronze.py e silver.py criam as tabelas de cada fonte a partir do config/fontes.yml.
# O código-fonte é a pasta src/pipeline inteira (glob, relativo a este arquivo): um
# silver_<nome>.sql ou gold_*.sql novo entra sozinho, sem citar o projeto aqui. Por isso a
# pasta só pode ter código do pipeline (um teste confere). O glob está em Public Preview.
# A chave essentials_pipeline não muda: trocá-la faria o bundle apagar o pipeline e as
# tabelas dele. O nome visível é o "name".
resources:
  pipelines:
    essentials_pipeline:
      name: ${var.projeto}_pipeline_medalhao
      # Schema padrão: silver. A bronze e a gold são publicadas com o nome totalmente
      # qualificado, nos schemas de cada camada (schema_bronze e schema_gold).
      catalog: ${resources.schemas.silver.catalog_name}
      schema: ${resources.schemas.silver.name}
      serverless: true
      continuous: false
      channel: CURRENT
      # Event log publicado no schema de monitoramento (só a engenharia lê): fonte das views
      # mon_* (docs/adr/0003).
      event_log:
        catalog: ${resources.schemas.monitoramento.catalog_name}
        schema: ${resources.schemas.monitoramento.name}
        name: mon_log_eventos
      configuration:
        catalogo: ${var.catalog}
        projeto: ${var.projeto}
        schema_bronze: ${resources.schemas.bronze.name}
        schema_silver: ${resources.schemas.silver.name}
        schema_gold: ${resources.schemas.gold.name}
        schema_monitoramento: ${resources.schemas.monitoramento.name}
        landing_path: /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}
        fontes_config: ${workspace.file_path}/config/fontes.yml
        diretorio_codigo: ${workspace.file_path}/src
        # Novas tentativas automáticas numa falha. O padrão (5 da atualização inteira) fazia uma
        # regra que para a carga rodar 6 vezes, ~14 min e ~6x o custo, sem chance de passar:
        # o arquivo é o mesmo. Uma tentativa cobre falha passageira da plataforma.
        pipelines.numUpdateRetryAttempts: "1"
        pipelines.maxFlowRetryAttempts: "1"
      environment:
        # Versões fixas, num único lugar: requirements-runtime.txt.
        dependencies:
          - -r ${workspace.file_path}/requirements-runtime.txt
      libraries:
        - glob:
            include: ../src/pipeline/**
