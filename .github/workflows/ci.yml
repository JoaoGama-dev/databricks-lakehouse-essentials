name: CI

# Roda em todo pull request para a main: lint, testes e validação do bundle.
# Actions e runner com versão fixa: atualize por PR, com versões publicadas há pelo
# menos 2 semanas. Os jobs "testes" e "validar_bundle" são obrigatórios na main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest -q

  validar_bundle:
    needs: testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: databricks/setup-cli@v1.21.0

      # O Free Edition não tem service principal com OIDC, por isso dev usa token.
      # O host do workspace de dev vem só da variável do repositório (não está no databricks.yml).
      - name: Validar bundle (dev)
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
