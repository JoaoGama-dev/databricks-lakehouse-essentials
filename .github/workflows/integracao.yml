name: Integração

# Teste de ponta a ponta no Free Edition com os dados fictícios (docs/adr/0005): implanta
# o target ci (schemas dev_<usuário>_<projeto>_ci_bronze, _ci_silver, _ci_gold e
# _ci_monitoramento, separados do dev), roda a carga em duas rodadas, confere os dados e
# apaga tudo no fim, mesmo quando algo falha.
#   rodada 1  agenda v1: carga inicial
#   rodada 2  agendas v2, v6, v7 e v5 numa carga só: histórico SCD2, desempate do retrato
#             e arquivo_ignorado com vários arquivos na mesma carga
# Os cenários que saíram daqui (cp1252, full refresh, regra que para a carga, queda de
# volume) são cobertos por testes de unidade; os arquivos v3, v4 e v8 continuam em data/.
# Nunca roda em pull request: não há gatilho de PR, então código de fork não chega ao
# token do workspace.
on:
  workflow_dispatch:
  schedule:
    # 1h em Brasília (4h UTC), de segunda a sexta.
    - cron: "0 4 * * 1-5"

# Nenhuma permissão por padrão; o job declara só o que usa.
permissions: {}

# Uma execução por vez: duas ao mesmo tempo disputariam os mesmos schemas do ci.
concurrency:
  group: integracao
  cancel-in-progress: false

jobs:
  integracao:
    runs-on: ubuntu-24.04
    # Cerca de 15 minutos: duas cargas de 3 a 6 minutos, mais deploy, preparação,
    # conferências e destroy. 30 minutos dão folga sem esconder travamento.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # O Free Edition não tem service principal com OIDC: o ci usa o token de dev.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
      INTEGRACAO_RECURSOS: recursos-ci.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9 # v1.21.0

      # Começa do zero: sobras de uma execução anterior (destroy que falhou, teste local)
      # fariam a v1 ser lida sobre dados antigos. Sem nada implantado, os dois são no-op.
      - name: Apagar sobras de execuções anteriores
        run: |
          databricks bundle summary -t ci -o json > "$INTEGRACAO_RECURSOS"
          databricks bundle destroy -t ci --auto-approve
          python scripts/integracao.py limpar

      - name: Implantar o target ci
        run: databricks bundle deploy -t ci --auto-approve

      - name: Guardar os nomes dos recursos do ci
        run: databricks bundle summary -t ci -o json > "$INTEGRACAO_RECURSOS"

      - name: Preparar a landing vazia
        run: python scripts/integracao.py preparar

      # A gold usa a função de máscara: ela precisa existir antes de validar o grafo.
      - name: Criar a função de máscara e o log da carga
        run: databricks bundle run essentials_carga_diaria -t ci --only preparar_governanca

      - name: Validar o grafo do pipeline (sem processar dados)
        run: databricks bundle run essentials_pipeline -t ci --validate-only

      - name: "Rodada 1: enviar a agenda v1"
        run: python scripts/integracao.py enviar --versao 1

      - name: "Rodada 1: carga"
        run: databricks bundle run essentials_carga_diaria -t ci

      - name: "Rodada 1: conferir"
        run: INTEGRACAO_RODADA=1 pytest -m integracao tests/integracao/test_carga.py -v

      # Numa carga só, nesta ordem: a v2 (o conteúdo novo), a v6 (a v1 chegando atrasada), a
      # v7 (só o cabeçalho) e a v5 (a v2 de novo, com outro nome, enviada por último).
      - name: "Rodada 2: enviar as agendas v2, v6, v7 e v5"
        run: python scripts/integracao.py enviar --versao 2 6 7 5

      - name: "Rodada 2: carga"
        run: databricks bundle run essentials_carga_diaria -t ci

      - name: "Rodada 2: conferir"
        run: INTEGRACAO_RODADA=2 pytest -m integracao tests/integracao/test_carga.py -v

      - name: Destruir o target ci
        if: always()
        run: databricks bundle destroy -t ci --auto-approve

      # O que o destroy não leva (tabelas do pipeline, event log e log da carga). Só aceita
      # schemas do ci.
      - name: Apagar os schemas que sobrarem do ci
        if: always()
        run: |
          if [ -f "$INTEGRACAO_RECURSOS" ]; then
            python scripts/integracao.py limpar
          else
            echo "Sem resumo do bundle: o deploy não chegou a criar recursos."
          fi
